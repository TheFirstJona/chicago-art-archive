<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Chicago Art Archive</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <header class="site-header">
    <div class="container header-content">
      <div class="brand">
        <h1>Chicago Art Archive</h1>
        <p class="subtitle">Exploring the collection of the Art Institute of Chicago</p>
      </div>
      <nav class="main-nav" aria-label="Main Navigation">
        <button id="nav-artworks" class="nav-btn active" data-view="artworks">Artworks</button>
        <button id="nav-exhibitions" class="nav-btn" data-view="exhibitions">Exhibitions</button>
      </nav>
    </div>
  </header>

  <main class="container main-content">
    <section class="controls-section" aria-label="Search and controls">
      <form id="search-form" class="search-form">
        <label for="search-input" class="sr-only">Search artworks</label>
        <input 
          type="text" 
          id="search-input" 
          placeholder="Search by artwork title, artist, or style." 
          autocomplete="off"
        />
        <button type="submit" class="btn-search">Search</button>
        <button type="button" id="btn-clear" class="btn-clear hidden">Clear</button>
      </form>
    </section>

    <div id="status-message" class="status-message hidden" role="status" aria-live="polite"></div>
    
    <section id="artworks-view" class="view-panel">
      <h2 class="section-title">Featured Artworks</h2>
      <div id="artworks-grid" class="cards-grid">
      </div>
    </section>

    <section id="exhibitions-view" class="view-panel hidden">
      <h2 class="section-title">Current & Recent Exhibitions</h2>
      <div id="exhibitions-grid" class="cards-grid">
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Data provided by the <a href="https://api.artic.edu/docs/" target="_blank" rel="noopener noreferrer">Art Institute of Chicago API</a>.</p>
    </div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
